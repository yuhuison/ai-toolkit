      - prompt: "生成一张赛璐璐厚涂画风的角色同人插画，将图1中的角色置于床上被红色绳索捆绑的场景：图1中的少女，保持其粉色长发、蓝色双瞳与头顶的黑色蝴蝶结发饰不变。她全身赤裸，仅被红色的绳索紧紧捆绑，绳索勒过她丰满的乳房、腰部和双腿，一根绳索从双腿间穿过，勒住外阴。她的嘴里戴着一个黑色的口交球，有口水流出。少女仰卧在铺着白色床单的铁架床上，双腿大张，正对镜头，露出外阴和肛门，大腿和腹部有汗水或爱液的反光。她面色潮红，眼神迷离地看着镜头。背景是昏暗的房间，床单上有褶皱，旁边散落着一条粉色内裤。画面采用平视视角，光影对比强烈，凸显了肉体的质感。"
        ctrl_img: /workspace/refchar_v21/sample_set/reference/10_train_nsfw_351571.jpg
        seed: 42010
        width: 832
        height: 640
        guidance_scale: 4
        sample_steps: 25
      - prompt: "生成一张赛璐璐平涂画风的角色同人插画，将图1中的角色置于户外栏杆前、背对镜头俯身撅臀的场景：图1中的女性角色，保持其金发、尖耳与面部特征不变。她上半身穿着带有金色肩甲的短袖上衣，背部大面积裸露，下半身仅穿着一条带有镂空花纹的紫色丁字裤，暴露出丰满的臀部与大腿，股沟与外阴部分隐约可见。她背对镜头，双手撑在身前的木质栏杆上，上半身前倾，臀部高高翘起朝向镜头，头部向右后方回眸，眼神瞥向镜头。背景是傍晚时分的山脉与云层。画面采用从后方平视的视角，重点刻画了臀部的肉感与高光，光影柔和，色彩偏暖。"
